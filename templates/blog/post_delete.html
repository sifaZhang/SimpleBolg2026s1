{%  extends 'base.html' %}
{% block title %}
    Delete Post
{% endblock %}

{% block content %}
    <h1>Delete Post</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this post?</p>
        {{ form.as_p }}
        <button type="submit">Delete</button>
    </form>
{% endblock %}
